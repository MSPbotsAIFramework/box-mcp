# Local debugging only. Credentials are never configured here: send the
# X-Box-Client-Id, X-Box-Client-Secret and X-Box-Enterprise-Id headers on each
# request, as the gateway does.
services:
  box-mcp:
    build:
      context: .
      target: production
    image: box-mcp:dev
    ports:
      - "8080:8080"
    environment:
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
